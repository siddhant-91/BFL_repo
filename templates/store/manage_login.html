{% extends 'store/base.html' %}
{% block title %}Owner sign in — BFL{% endblock %}
{% block content %}<div class="login-box"><p class="eyebrow">BFL STORE MANAGEMENT</p><h1>Welcome back.</h1><form method="post" class="stack-form">{% csrf_token %}<label>Username<input required name="username" autocomplete="username"></label><label>Password<input required name="password" type="password" autocomplete="current-password"></label><button class="button button-dark button-wide">Sign in</button></form><p class="micro-copy">Create your owner login with <code>python manage.py createsuperuser</code>.</p></div>{% endblock %}
